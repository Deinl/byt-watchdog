name: byt-watchdog

on:
  schedule:
    # Every 10 minutes (GitHub runs cron best-effort; delays of several minutes are normal).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Read-only token: dedupe state persists through actions/cache, never via commits.
permissions:
  contents: read

# Never run two checks at once (they would race on the cached state).
concurrency:
  group: byt-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Restore the newest seen.json. Caches are immutable, so every run saves under a
      # new key and restore-keys picks the most recent one.
      - name: Restore dedupe state
        uses: actions/cache/restore@v4
        with:
          path: state/seen.json
          key: seen-v1-${{ github.run_id }}
          restore-keys: |
            seen-v1-

      - name: Check portals
        env:
          # Repository secret. If unset, the script runs in dry-run mode and only logs.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node src/index.mjs

      - name: Save dedupe state
        if: always() && hashFiles('state/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/seen.json
          key: seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
